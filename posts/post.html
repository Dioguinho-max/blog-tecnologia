<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artigo do Tech & IA Blog.">
    <title>Artigo | Tech & IA Blog</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="../index.html">Tech <span>&amp; IA</span> Blog</a>
            <nav class="main-nav about-nav" aria-label="Navegação principal"><a href="../index.html">Início</a><a href="../index.html#posts">Artigos</a></nav>
        </div>
    </header>
    <main id="dynamic-post"><p class="empty-state">Carregando artigo...</p></main>
    <footer class="site-footer"><p>© 2026 Tech &amp; IA Blog.</p></footer>
    <script src="../config.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get("id");
        const container = document.querySelector("#dynamic-post");
        const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
        const formatContent = (content) => escapeHtml(content).split(/\n\s*\n/).filter(Boolean).map((paragraph) => `<p>${paragraph.replace(/\n/g, "<br>")}</p>`).join("");
        if (!id) {
            container.innerHTML = '<p class="empty-state">Artigo inválido.</p>';
        } else {
            fetch(`${window.TECH_IA_API_URL || "/api"}/posts/${encodeURIComponent(id)}`)
                .then((response) => response.ok ? response.json() : Promise.reject())
                .then((post) => {
                    document.title = `${post.titulo} | Tech & IA Blog`;
                    const imageUrl = post.imagem && !/^https?:\/\//.test(post.imagem) ? `../${post.imagem.replace(/^\//, "")}` : post.imagem;
                    const publishedAt = new Intl.DateTimeFormat("pt-BR", { dateStyle: "long" }).format(new Date(post.createdAt));
                    const readingTime = Math.max(1, Math.ceil(post.conteudo.trim().split(/\s+/).length / 220));
                    container.innerHTML = `<section class="article-hero"><div class="article-hero-inner"><a class="breadcrumb" href="../index.html#posts">← Todos os artigos</a><span class="tag">${escapeHtml(post.categoria)}</span><h1>${escapeHtml(post.titulo)}</h1><p class="article-summary">${escapeHtml(post.resumo)}</p><div class="article-meta-row"><span>${publishedAt}</span><span aria-hidden="true">•</span><span>${readingTime} min de leitura</span></div></div></section><div class="article-layout">${imageUrl ? `<img class="article-cover" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(post.imagemAlt || post.titulo)}">` : ""}<article class="article-prose">${formatContent(post.conteudo)}<div class="article-end"><a class="button button-primary" href="../index.html#posts">← Ver mais artigos</a></div></article></div>`;
                })
                .catch(() => { container.innerHTML = '<p class="empty-state">Não foi possível carregar este artigo.</p>'; });
        }
    </script>
</body>
</html>
