<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artigo do Tech & IA Blog.">
    <link id="canonical-url" rel="canonical" href="https://techiablog.vercel.app/posts/post.html">
    <meta id="og-type" property="og:type" content="article">
    <meta id="og-title" property="og:title" content="Artigo | Tech & IA Blog">
    <meta id="og-description" property="og:description" content="Artigo do Tech & IA Blog.">
    <meta id="og-url" property="og:url" content="https://techiablog.vercel.app/posts/post.html">
    <meta id="og-image" property="og:image" content="">
    <meta name="twitter:card" content="summary_large_image">
    <title>Artigo | Tech & IA Blog</title>
    <link rel="icon" href="../imagens/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="../index.html">Tech <span>&amp; IA</span> Blog</a>
            <div class="header-actions"><nav class="main-nav about-nav" aria-label="Navegação principal"><a href="../index.html">Início</a><a href="../index.html#posts">Artigos</a></nav><button class="theme-toggle" type="button" aria-label="Ativar modo escuro" title="Alternar tema">☾</button></div>
        </div>
    </header>
    <main id="dynamic-post"><p class="empty-state">Carregando artigo...</p></main>
    <footer class="site-footer"><p>© 2026 Tech &amp; IA Blog.</p><nav class="footer-links" aria-label="Links institucionais"><a href="../sobre.html">Sobre</a><a href="../versao.html">Versão</a><a href="../politica-de-privacidade.html">Privacidade</a><a href="../termos-de-uso.html">Termos de uso</a></nav></footer>
    <script src="../config.js"></script>
    <script src="../chat.js"></script>
    <script>
        const themeToggle = document.querySelector(".theme-toggle");
        function setTheme(isDark) {
            document.body.classList.toggle("dark-theme", isDark);
            themeToggle.textContent = isDark ? "☀" : "☾";
            themeToggle.setAttribute("aria-label", isDark ? "Ativar modo claro" : "Ativar modo escuro");
            localStorage.setItem("tech-ia-theme", isDark ? "dark" : "light");
        }
        setTheme(localStorage.getItem("tech-ia-theme") === "dark");
        themeToggle.addEventListener("click", () => setTheme(!document.body.classList.contains("dark-theme")));
        const id = new URLSearchParams(window.location.search).get("id");
        const container = document.querySelector("#dynamic-post");
        const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
        function setSeo(post, imageUrl) {
            const siteUrl = window.TECH_IA_SITE_URL || window.location.origin;
            const canonical = `${siteUrl}/posts/post.html?id=${encodeURIComponent(post.id)}`;
            const absoluteImage = imageUrl ? new URL(imageUrl, siteUrl).href : "";
            document.querySelector('meta[name="description"]').setAttribute("content", post.resumo);
            document.querySelector("#canonical-url").setAttribute("href", canonical);
            document.querySelector("#og-title").setAttribute("content", `${post.titulo} | Tech & IA Blog`);
            document.querySelector("#og-description").setAttribute("content", post.resumo);
            document.querySelector("#og-url").setAttribute("content", canonical);
            if (absoluteImage) document.querySelector("#og-image").setAttribute("content", absoluteImage);
            let schema = document.querySelector("#article-schema");
            if (!schema) { schema = document.createElement("script"); schema.id = "article-schema"; schema.type = "application/ld+json"; document.head.append(schema); }
            schema.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "BlogPosting", headline: post.titulo, description: post.resumo, datePublished: post.createdAt, dateModified: post.updatedAt, image: absoluteImage || undefined, mainEntityOfPage: canonical, author: { "@type": "Organization", name: "Tech & IA Blog" }, publisher: { "@type": "Organization", name: "Tech & IA Blog" } });
        }
        function formatTextBlock(block) {
            return block.trim().split(/\n\s*\n/).filter(Boolean).map((part) => {
                const lines = part.split("\n");
                const firstLine = lines[0].trim();
                const markdownHeading = firstLine.match(/^#{1,3}\s+(.+)/);
                const plainHeading = lines.length > 1 && firstLine.length < 70 && !/[.!?:;]$/.test(firstLine);
                if (markdownHeading || plainHeading) {
                    const title = markdownHeading ? markdownHeading[1] : firstLine;
                    const text = lines.slice(1).join("\n").trim();
                    return `<h2>${escapeHtml(title)}</h2>${text ? `<p>${escapeHtml(text).replace(/\n/g, "<br>")}</p>` : ""}`;
                }
                if (lines.every((line) => /^[-*]\s+/.test(line.trim()))) {
                    return `<ul>${lines.map((line) => `<li>${escapeHtml(line.replace(/^[-*]\s+/, ""))}</li>`).join("")}</ul>`;
                }
                return `<p>${escapeHtml(part).replace(/\n/g, "<br>")}</p>`;
            }).join("");
        }
        function formatContent(content) {
            return content.split(/```/).map((block, index) => {
                if (index % 2 === 0) return formatTextBlock(block);
                const code = block.replace(/^\w*\n?/, "").trim();
                return `<div class="code-block"><div class="code-toolbar"><span>Código</span><button class="copy-code" type="button" data-code="${encodeURIComponent(code)}">Copiar</button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
            }).join("");
        }
        function setupReadingExperience(post) {
            const progress = document.querySelector("#reading-progress-value");
            const updateProgress = () => {
                const article = document.querySelector(".article-prose");
                const start = article.getBoundingClientRect().top + window.scrollY - 110;
                const distance = Math.max(article.offsetHeight - window.innerHeight * .45, 1);
                const percentage = Math.min(100, Math.max(0, ((window.scrollY - start) / distance) * 100));
                progress.style.width = `${percentage}%`;
            };
            window.addEventListener("scroll", updateProgress, { passive: true });
            updateProgress();

            const headings = [...document.querySelectorAll(".article-prose h2")];
            const toc = document.querySelector("#article-toc");
            headings.forEach((heading, index) => {
                heading.id = `topico-${index + 1}`;
                const link = document.createElement("a");
                link.href = `#${heading.id}`;
                link.textContent = heading.textContent;
                toc.append(link);
            });
            const tocBlock = document.querySelector(".article-toc");
            if (!headings.length) tocBlock.hidden = true;
            if (window.matchMedia("(max-width: 800px)").matches) tocBlock.removeAttribute("open");

            const shareUrl = `${window.TECH_IA_SITE_URL || window.location.origin}/posts/post.html?id=${encodeURIComponent(post.id)}`;
            document.querySelector("#copy-article-link").addEventListener("click", async (event) => {
                await navigator.clipboard.writeText(shareUrl);
                event.currentTarget.textContent = "Link copiado!";
                setTimeout(() => { event.currentTarget.textContent = "Copiar link"; }, 1800);
            });
            document.querySelector("#share-article").addEventListener("click", async () => {
                if (navigator.share) await navigator.share({ title: post.titulo, text: post.resumo, url: shareUrl });
                else document.querySelector("#copy-article-link").click();
            });
            let session; try { session = JSON.parse(localStorage.getItem("tech-ia-reader-session")); } catch { session = null; }
            const favorite = document.querySelector("#favorite-article");
            if (!session?.access_token) favorite.textContent = "Entre para favoritar";
            favorite.addEventListener("click", async () => {
                if (!session?.access_token) return window.location.assign("../conta.html");
                const response = await fetch(`${window.TECH_IA_API_URL || "/api"}/reader/favorites/${post.id}`, { method: "POST", headers: { Authorization: `Bearer ${session.access_token}` } });
                if (response.ok) favorite.textContent = "♥ Favoritado";
            });
            let lastProgress = -1;
            window.addEventListener("scroll", () => {
                const value = Math.round(parseFloat(progress.style.width || "0"));
                if (!session?.access_token || value < 5 || Math.abs(value - lastProgress) < 10) return;
                lastProgress = value;
                fetch(`${window.TECH_IA_API_URL || "/api"}/reader/progress/${post.id}`, { method: "PUT", headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ progress: value }) });
            }, { passive: true });
        }
        function setupComments(post) {
            const section = document.querySelector("#comments-section"), list = document.querySelector("#comments-list"), form = document.querySelector("#comment-form"), message = document.querySelector("#comment-message");
            const api = window.TECH_IA_API_URL || "/api";
            const render = (comments) => { list.innerHTML = comments.length ? comments.map((item) => `<article><strong>${escapeHtml(item.authorName)}</strong><time>${new Intl.DateTimeFormat("pt-BR", { dateStyle: "medium" }).format(new Date(item.createdAt))}</time><p>${escapeHtml(item.content)}</p></article>`).join("") : "<p class=\"comments-empty\">Ainda não há comentários. Seja a primeira pessoa a comentar.</p>"; };
            let session; try { session = JSON.parse(localStorage.getItem("tech-ia-reader-session")); } catch { session = null; }
            const renderMine = (comments) => { const pending = comments.filter((item) => !item.published); if (!pending.length) return; list.insertAdjacentHTML("afterbegin", `<div class="my-comments"><strong>Seus comentários aguardando aprovação</strong>${pending.map((item) => `<article><p>${escapeHtml(item.content)}</p><button type="button" data-delete-own-comment="${item.id}">Excluir comentário</button></article>`).join("")}</div>`); };
            Promise.all([fetch(`${api}/comments/posts/${post.id}`).then((response) => response.json()), session?.access_token ? fetch(`${api}/comments/posts/${post.id}/mine`, { headers: { Authorization: `Bearer ${session.access_token}` } }).then((response) => response.ok ? response.json() : { comments: [] }) : Promise.resolve({ comments: [] })]).then(([publicData, mineData]) => { render(publicData.comments || []); renderMine(mineData.comments || []); section.hidden = false; }).catch(() => { section.hidden = false; });
            form.addEventListener("submit", async (event) => { event.preventDefault(); let session; try { session = JSON.parse(localStorage.getItem("tech-ia-reader-session")); } catch { session = null; } if (!session?.access_token) return window.location.assign("../conta.html"); const content = form.elements.content.value.trim(); if (!content) return; const response = await fetch(`${api}/comments/posts/${post.id}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ content }) }); const data = await response.json().catch(() => ({})); message.textContent = response.ok ? data.message : data.message || "Não foi possível enviar o comentário."; if (response.ok) form.reset(); });
            list.addEventListener("click", async (event) => { const id = event.target.dataset.deleteOwnComment; if (!id || !session?.access_token || !confirm("Excluir este comentário?")) return; const response = await fetch(`${api}/comments/posts/mine/${id}`, { method: "DELETE", headers: { Authorization: `Bearer ${session.access_token}` } }); if (response.ok) event.target.closest("article").remove(); });
        }
        async function loadRelatedPosts(post) {
            const section = document.querySelector("#related-posts");
            const grid = document.querySelector("#related-grid");
            try {
                const response = await fetch(`${window.TECH_IA_API_URL || "/api"}/posts?categoria=${encodeURIComponent(post.categoria)}&limit=4`);
                const data = await response.json();
                const related = (data.posts || []).filter((item) => item.id !== post.id).slice(0, 3);
                if (!related.length) return;
                grid.innerHTML = related.map((item) => `<article><span class="tag">${escapeHtml(item.categoria)}</span><h3>${escapeHtml(item.titulo)}</h3><p>${escapeHtml(item.resumo)}</p><a href="post.html?id=${encodeURIComponent(item.id)}">Ler artigo →</a></article>`).join("");
                section.hidden = false;
            } catch { /* A leitura do artigo continua disponível sem relacionados. */ }
        }
        container.addEventListener("click", async (event) => {
            const button = event.target.closest(".copy-code");
            if (!button) return;
            try {
                await navigator.clipboard.writeText(decodeURIComponent(button.dataset.code));
                button.textContent = "Copiado!";
                setTimeout(() => { button.textContent = "Copiar"; }, 1800);
            } catch { button.textContent = "Não foi possível copiar"; }
        });
        if (!id) {
            container.innerHTML = '<p class="empty-state">Artigo inválido.</p>';
        } else {
            fetch(`${window.TECH_IA_API_URL || "/api"}/posts/${encodeURIComponent(id)}`)
                .then((response) => response.ok ? response.json() : Promise.reject())
                .then((post) => {
                    document.title = `${post.titulo} | Tech & IA Blog`;
                    window.TECH_IA_ARTICLE_CONTEXT = { title: post.titulo, summary: post.resumo, content: post.conteudo };
                    window.dispatchEvent(new Event("techiaarticlecontext"));
                    const imageUrl = post.imagem && !/^https?:\/\//.test(post.imagem) ? `../${post.imagem.replace(/^\//, "")}` : post.imagem;
                    setSeo(post, imageUrl);
                    fetch(`${window.TECH_IA_API_URL || "/api"}/posts/${encodeURIComponent(post.id)}/view`, { method: "POST" }).catch(() => {});
                    const publishedAt = new Intl.DateTimeFormat("pt-BR", { dateStyle: "long" }).format(new Date(post.createdAt));
                    const readingTime = Math.max(1, Math.ceil(post.conteudo.trim().split(/\s+/).length / 220));
                    container.innerHTML = `<div class="reading-progress" aria-hidden="true"><span id="reading-progress-value"></span></div><section class="article-hero">${imageUrl ? `<img class="article-hero-bg" src="${escapeHtml(imageUrl)}" alt="">` : ""}<div class="article-title-card"><a class="breadcrumb" href="../index.html#posts">← Todos os artigos</a><span class="tag">${escapeHtml(post.categoria)}</span><h1>${escapeHtml(post.titulo)}</h1><p class="article-summary">${escapeHtml(post.resumo)}</p><div class="article-meta-row"><span>${publishedAt}</span><span aria-hidden="true">•</span><span>${readingTime} min de leitura</span></div></div></section><div class="article-layout"><div class="article-reading"><article class="article-prose">${formatContent(post.conteudo)}<div class="article-end"><a class="button button-primary" href="../index.html#posts">← Ver mais artigos</a></div></article><aside class="article-sidebar"><details class="article-toc" open><summary>Auxilia a leitura</summary><div class="article-toc-content"><p>Neste artigo</p><div id="article-toc"></div></div></details><div class="article-share"><p>Sua conta</p><button id="favorite-article" type="button">♡ Favoritar</button></div><div class="article-share"><p>Compartilhe</p><button id="share-article" type="button">Compartilhar</button><button id="copy-article-link" type="button">Copiar link</button></div></aside></div><section id="related-posts" class="related-posts" hidden><p class="eyebrow">Continue aprendendo</p><h2>Artigos relacionados</h2><div id="related-grid" class="related-grid"></div></section><section id="comments-section" class="comments-section" hidden><p class="eyebrow">Comunidade</p><h2>Comentários</h2><div id="comments-list"></div><form id="comment-form"><label>Compartilhe sua dúvida ou experiência<textarea name="content" maxlength="1000" required placeholder="Escreva um comentário respeitoso..."></textarea></label><button class="button button-primary">Enviar para moderação</button><p id="comment-message" class="form-message" aria-live="polite"></p></form></section></div>`;
                    setupReadingExperience(post);
                    loadRelatedPosts(post);
                    setupComments(post);
                })
                .catch(() => { container.innerHTML = '<p class="empty-state">Não foi possível carregar este artigo.</p>'; });
        }
    </script>
</body>
</html>
