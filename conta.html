<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Acesse sua conta no Tech & IA Blog."><title>Conta | Tech & IA Blog</title><link rel="icon" href="imagens/logo-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="header-content"><a class="brand" href="index.html">Tech <span>&amp; IA</span> Blog</a><div class="header-actions"><nav class="main-nav about-nav"><a href="index.html">Início</a></nav><button class="theme-toggle" type="button" aria-label="Alternar tema">☾</button></div></div></header>
<main class="account-page"><section class="account-card"><p class="eyebrow">Comunidade</p><h1 id="account-title">Entre na sua conta</h1><p id="account-description">Salve seus favoritos e acompanhe o Tech &amp; IA Blog.</p><form id="account-form"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="6" required></label><button class="button button-primary" id="account-submit">Entrar</button></form><div class="oauth-separator"><span>ou</span></div><button id="google-login" class="google-login" type="button"><span aria-hidden="true">G</span> Continuar com Google</button><button id="account-mode" class="account-link" type="button">Ainda não tem conta? Criar cadastro</button><p id="account-message" class="form-message" aria-live="polite"></p><div id="account-user" hidden><label class="avatar-picker"><img id="account-avatar" alt="Foto de perfil"><span>Alterar foto</span><input id="avatar-input" type="file" accept="image/*"></label><p>Você está conectado como <strong id="account-email"></strong>.</p><section id="reader-library" class="reader-library" hidden><h2>Sua biblioteca</h2><div id="reader-library-content"></div></section><details><summary>Configurações da conta</summary><form id="settings-form"><label>Novo e-mail<input name="email" type="email"></label><label>Nova senha<input name="password" type="password" minlength="6"></label><button class="filter" type="submit">Salvar alterações</button></form></details><button id="account-logout" class="filter" type="button">Sair da conta</button></div></section></main>
