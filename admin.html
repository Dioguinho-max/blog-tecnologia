<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administração | Tech & IA Blog</title><link rel="icon" href="imagens/logo-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="header-content"><a class="brand" href="index.html">Tech <span>&amp; IA</span> Blog</a><div class="header-actions"><nav class="main-nav about-nav"><a href="index.html">Ver blog</a></nav><button class="theme-toggle" type="button" aria-label="Ativar modo escuro" title="Alternar tema">☾</button></div></div></header>
<main class="admin-page">
    <section id="login-panel" class="admin-card"><p class="eyebrow">Área restrita</p><h1>Entrar no painel</h1><form id="login-form"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="button button-primary">Entrar</button><p id="login-message" class="form-message" aria-live="polite"></p></form></section>
<section id="admin-panel" hidden><div class="admin-title"><div><p class="eyebrow">Gerenciamento</p><h1>Posts do blog</h1></div><button id="logout" class="filter">Sair</button></div><div class="admin-layout"><section class="admin-card"><h2 id="form-title">Novo post</h2><form id="post-form"><input name="id" type="hidden"><label>Título<input name="titulo" maxlength="160" required></label><label>Resumo<textarea name="resumo" maxlength="320" required></textarea></label><label>Conteúdo<textarea name="conteudo" rows="10" maxlength="50000" required></textarea><small>Use <code>## Título</code> para tópicos e três crases antes e depois de um código.</small></label><label>Categoria<select name="categoria" required><option value="IA">IA</option><option value="Linux">Linux</option><option value="Web">Web</option><option value="Tecnologia">Tecnologia</option></select></label><label>Imagem (URL ou caminho)<input name="imagem"></label><label>Texto alternativo<input name="imagemAlt"></label><label class="check"><input name="publicado" type="checkbox"> Publicar agora</label><label class="check"><input name="destaque" type="checkbox"> Artigo em destaque</label><div class="form-actions"><button class="button button-primary">Salvar post</button><button id="cancel-edit" class="filter" type="button" hidden>Cancelar</button></div><p id="post-message" class="form-message" aria-live="polite"></p></form></section><section class="admin-card"><h2>Posts existentes</h2><div id="admin-post-list" class="admin-post-list"></div></section></div></section>
</main>
<footer class="site-footer"><p>© 2026 Tech &amp; IA Blog.</p></footer>
<script src="config.js"></script>
<script src="admin.js"></script>
</body></html>
