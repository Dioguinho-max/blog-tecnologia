services:
  - type: web
    name: tech-ia-blog
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: "Qwen/Qwen2.5-7B-Instruct:fastest"
      - key: CHAT_RATE_LIMIT
        value: "8"
      - key: CHAT_MAX_TOKENS
        value: "340"
